name: "[REUSABLE] Sync Team Access - Nudge"

# Tells the central team-access sync in geolonia-operations that this
# repository's catalog-info.yaml changed. The payload carries only the
# repository name: the central workflow fetches catalog-info.yaml from the
# repository's default branch itself and decides what to apply, so nothing a
# caller sends can grant access. Individual repositories never see the
# org-level token.
#
# Without this nudge the change is still picked up by the nightly fleet run
# in geolonia-operations; the nudge only makes it immediate.

on:
  workflow_call:
    inputs:
      dispatch_repo:
        description: "Repository that processes sync requests (owner/repo)"
        type: string
        required: false
        default: ""
    secrets:
      OPS_DISPATCH_CLIENT_ID:
        description: "Operations-Geolonia GitHub App Client ID (dispatches events to geolonia-operations)"
        required: true
      OPS_DISPATCH_APP_PRIVATE_KEY:
        description: "Operations-Geolonia GitHub App private key"
        required: true

permissions: {}

jobs:
  dispatch:
    name: Nudge the central team-access sync
    runs-on: ubuntu-latest
    # Only the default branch is reviewed and only the default branch is
    # what the central sync reads, so a run from any other ref (a manual run
    # on a feature branch, a misconfigured caller) has nothing to nudge.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)

    steps:
      - name: Resolve dispatch target repo name
        id: target
        env:
          DISPATCH_REPO: ${{ inputs.dispatch_repo }}
          REPO_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          FULL="${DISPATCH_REPO:-${REPO_OWNER}/geolonia-operations}"
          if [[ ! "$FULL" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::invalid dispatch_repo '$FULL'"
            exit 1
          fi
          {
            echo "repo_name=${FULL##*/}"
            echo "full=$FULL"
          } >> "$GITHUB_OUTPUT"

      - name: Generate dispatch token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.OPS_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.OPS_DISPATCH_APP_PRIVATE_KEY }}
          repositories: ${{ steps.target.outputs.repo_name }}
          owner: ${{ github.repository_owner }}
          # Least privilege: the token only sends a repository_dispatch to the
          # central repo, which needs contents write. Already narrowed to a
          # single repo above; also narrow the permission set.
          permission-contents: write

      - name: Dispatch sync request
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          TARGET: ${{ steps.target.outputs.full }}
          REPO_FULL: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # source_repo is the only field the central sync reads; the rest is
          # informational for the run log.
          jq -n \
            --arg repo "$REPO_FULL" \
            --arg sha "$COMMIT_SHA" \
            --arg ref "$REF_NAME" \
            '{
              event_type: "sync-team-access",
              client_payload: {
                source_repo: $repo,
                commit_sha: $sha,
                ref: $ref
              }
            }' | gh api "repos/${TARGET}/dispatches" --input -

          echo "::notice::Nudged ${TARGET} to sync ${REPO_FULL}@${COMMIT_SHA:0:7}"
