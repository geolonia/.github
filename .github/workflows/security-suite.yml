name: Security Suite

# Geolonia's per-PR security gate, as a thin caller of the reusable suite.
#
# This file is the org "required workflow": point a Repository Ruleset
# ("Require workflows to pass before merging") at
#
#   geolonia/.github/.github/workflows/security-suite.yml@<ref>
#
# and every targeted repo runs the suite with NO file of its own.
# geolonia/.github is public, so the ruleset can target public, internal,
# and private repos. A ruleset-injected run IGNORES every event filter in the
# `on:` block below (branches, paths, types); which pull requests it covers is
# decided by the ruleset's own ref condition, so that condition, not this file,
# is what has to include non-default base branches.
#
# The same thin caller is also offered in the org "New workflow" picker
# (workflow-templates/security-suite.yml) for repos that opt in manually
# instead of via the ruleset. Do not run both on one repo.
#
# All suite logic (bumblebee, betterleaks, pinact, zizmor, and the single
# consolidated PR comment) lives in the reusable so there is one source of
# truth. See reusable-security-suite.yml.

# No `branches:` filter on purpose. A pull request opened against a base other
# than the default branch (a stacked PR, kept small so it stays reviewable) must
# be scanned too: when its base merges, GitHub retargets it to the default
# branch WITHOUT firing any workflow, so an unfiltered run at open time is the
# only scan it ever gets. Ruleset consumers ignore this block entirely (see
# above), so this governs only this repository's own pull requests.
on:
  pull_request:

# Serialize runs per PR so two overlapping runs cannot both miss the marker
# comment and each post a "single" consolidated comment.
concurrency:
  group: security-suite-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    # A called reusable can only downgrade the caller's token, so grant the
    # union the suite's jobs need (comment + bumblebee tracking issue); the
    # reusable narrows each job to its own minimum.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # Float on the major tag so the suite upgrades with no chain-bump. This is
    # the org "required workflow" (ruleset "require workflows"), and a floating
    # reusable ref here is FINE. The one hard requirement is that the `v1` tag
    # itself must be a LIGHTWEIGHT tag: the ruleset resolves this workflow at
    # `security-suite.yml@refs/tags/v1`, and the required-workflow injector
    # cannot resolve an ANNOTATED `v1` tag object, which makes the required
    # check hang silently at "Expected" on every consumer PR. See
    # docs/workflows/security-suite.md. (org .pinact.yml + zizmor.yml exempt
    # geolonia/* reusables at a major tag from pinning.)
    uses: geolonia/.github/.github/workflows/reusable-security-suite.yml@v1
