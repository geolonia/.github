name: "[REUSABLE] CDK Deploy Monitor"

on:
  workflow_call:
    inputs:
      stack_name:
        description: "CloudFormation stack name to monitor"
        type: string
        required: true
      aws_region:
        description: "AWS region where the stack is deployed"
        type: string
        required: true
      log_group_name:
        description: "CloudWatch log group name or prefix pattern (optional; leave empty to skip log fetching)"
        type: string
        required: false
        default: ""
      hang_threshold_minutes:
        description: "Minutes with no new CloudFormation event after which the update is judged hung and CANCEL is issued (unless only slow resource types are in flight, see slow_resource_grace_minutes)"
        type: number
        required: false
        default: 10
      slow_resource_grace_minutes:
        description: "Replaces hang_threshold_minutes while every in-flight resource is one of slow_resource_types, which legitimately stay silent for a long time (ECS waiting for healthy tasks, CloudFront propagating, ACM validating)"
        type: number
        required: false
        default: 20
      slow_resource_types:
        description: "Space-separated CloudFormation resource types that get slow_resource_grace_minutes instead of hang_threshold_minutes"
        type: string
        required: false
        default: "AWS::ECS::Service AWS::CloudFront::Distribution AWS::CertificateManager::Certificate AWS::RDS::DBInstance AWS::RDS::DBCluster"
      max_failed_tasks:
        description: "CANCEL as soon as this many ECS tasks have stopped abnormally (not drained by the deployment) since the update started, regardless of silence; 0 disables the check"
        type: number
        required: false
        default: 3
      poll_interval_seconds:
        description: "How often to poll CloudFormation and evaluate the verdict (seconds)"
        type: number
        required: false
        default: 120
      auto_cancel:
        description: "Whether a CANCEL verdict triggers cancel-update-stack (default: false = advisory only, comment is still posted)"
        type: boolean
        required: false
        default: false
      environment_name:
        description: "GitHub Actions environment name to use for this job (grants access to environment-scoped secrets; leave empty for repo-level secrets only)"
        type: string
        required: false
        default: ""
    secrets:
      aws_role_arn:
        description: "OIDC IAM role ARN with cloudformation:DescribeStacks, DescribeStackEvents, DescribeStackResources, CancelUpdateStack, logs:FilterLogEvents, DescribeLogGroups, ecs:ListTasks, DescribeTasks permissions (see CdkDeployMonitor permission bundle)"
        required: true

# Both are used by the monitor (it is not over-granted): a caller that
# downscopes contents will silently lose the commit comments.
permissions:
  id-token: write # OIDC: assume the monitor role (CloudFormation / ECS / logs)
  contents: write # post deploy-status commit comments

jobs:
  monitor:
    name: Monitor CDK deploy (${{ inputs.stack_name }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    timeout-minutes: 120
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Monitor and analyse
        env:
          STACK_NAME: ${{ inputs.stack_name }}
          AWS_REGION: ${{ inputs.aws_region }}
          LOG_GROUP_NAME: ${{ inputs.log_group_name }}
          HANG_THRESHOLD_MINUTES: ${{ inputs.hang_threshold_minutes }}
          SLOW_RESOURCE_GRACE_MINUTES: ${{ inputs.slow_resource_grace_minutes }}
          SLOW_RESOURCE_TYPES: ${{ inputs.slow_resource_types }}
          MAX_FAILED_TASKS: ${{ inputs.max_failed_tasks }}
          POLL_INTERVAL_SECONDS: ${{ inputs.poll_interval_seconds }}
          AUTO_CANCEL: ${{ inputs.auto_cancel }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          TERMINAL_STATUSES="CREATE_COMPLETE UPDATE_COMPLETE DELETE_COMPLETE \
            CREATE_FAILED UPDATE_FAILED DELETE_FAILED \
            ROLLBACK_COMPLETE UPDATE_ROLLBACK_COMPLETE \
            UPDATE_ROLLBACK_FAILED ROLLBACK_FAILED"

          is_terminal() {
            local s=$1
            for ts in $TERMINAL_STATUSES; do [[ "$s" == "$ts" ]] && return 0; done
            return 1
          }

          echo "Monitoring stack: $STACK_NAME"
          echo "Poll interval: ${POLL_INTERVAL_SECONDS}s"
          echo "Hang threshold: ${HANG_THRESHOLD_MINUTES}m with no CF events (${SLOW_RESOURCE_GRACE_MINUTES}m while only slow resources are in flight)"
          echo "Slow resource types: ${SLOW_RESOURCE_TYPES}"
          echo "Abnormal ECS task stops before CANCEL: ${MAX_FAILED_TASKS} (0 = disabled)"

          # Resolve log group name once (prefix → actual name)
          RESOLVED_LOG_GROUP=""
          if [[ -n "$LOG_GROUP_NAME" ]]; then
            RESOLVED_LOG_GROUP=$(aws logs describe-log-groups \
              --log-group-name-prefix "$LOG_GROUP_NAME" \
              --region "$AWS_REGION" \
              --query 'logGroups[0].logGroupName' \
              --output text 2>/dev/null || echo "")
            if [[ -z "$RESOLVED_LOG_GROUP" || "$RESOLVED_LOG_GROUP" == "None" ]]; then
              echo "Log group '$LOG_GROUP_NAME' not found -- log fetching disabled."
              RESOLVED_LOG_GROUP=""
            else
              echo "Log group: $RESOLVED_LOG_GROUP"
            fi
          fi

          # Look up ECS service and cluster from the CloudFormation stack resources.
          # This allows the monitor to fetch stopped task diagnostics (exit codes,
          # stopped reasons) without needing them passed as explicit inputs. They
          # feed the crash-loop check and the CANCEL comment.
          ECS_SERVICE_ARN=""
          ECS_CLUSTER=""
          CF_RESOURCES=$(aws cloudformation describe-stack-resources \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --output json 2>/dev/null || echo '{"StackResources":[]}')
          ECS_SERVICE_ARN=$(echo "$CF_RESOURCES" | \
            jq -r '.StackResources[] | select(.ResourceType=="AWS::ECS::Service") | .PhysicalResourceId' \
            | head -1)
          if [[ -n "$ECS_SERVICE_ARN" ]]; then
            # New ARN format embeds cluster: arn:aws:ecs:region:account:service/cluster/service-name
            SLASH_COUNT=$(echo "$ECS_SERVICE_ARN" | tr -cd '/' | wc -c)
            if [[ "$SLASH_COUNT" -ge 2 ]]; then
              ECS_CLUSTER=$(echo "$ECS_SERVICE_ARN" | cut -d'/' -f2)
            fi
            echo "ECS service: $ECS_SERVICE_ARN"
            echo "ECS cluster: ${ECS_CLUSTER:-unknown (old ARN format)}"
          else
            echo "No ECS service found in stack -- ECS diagnostics disabled."
          fi

          # If the stack is already in a terminal state when the monitor starts,
          # wait up to 5 minutes for the CDK deploy to begin its update before
          # entering the monitoring loop. This avoids premature exit when the
          # monitor job starts before CDK has called CloudFormation.
          INITIAL_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || echo "STACK_NOT_FOUND")

          echo "Initial stack status: $INITIAL_STATUS"

          if is_terminal "$INITIAL_STATUS"; then
            echo "Stack is already in a terminal state -- waiting up to 5m for the deploy to start..."
            STARTUP_DEADLINE=$(( $(date -u +%s) + 300 ))
            while true; do
              sleep 15
              INITIAL_STATUS=$(aws cloudformation describe-stacks \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION" \
                --query 'Stacks[0].StackStatus' \
                --output text 2>/dev/null || echo "STACK_NOT_FOUND")
              if ! is_terminal "$INITIAL_STATUS" && [[ "$INITIAL_STATUS" != "STACK_NOT_FOUND" ]]; then
                echo "Stack entered: $INITIAL_STATUS -- starting monitoring."
                break
              fi
              if [[ $(date -u +%s) -ge "$STARTUP_DEADLINE" ]]; then
                echo "Stack did not start a new update within 5m -- exiting."
                exit 0
              fi
            done
          fi

          # Track whether a CANCEL verdict was ever issued so the monitor job
          # exits with failure, making the problem visible in the Actions UI.
          CANCEL_ISSUED=false

          while true; do
            # Fetch stack status
            STACK_STATUS=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].StackStatus' \
              --output text 2>/dev/null || echo "STACK_NOT_FOUND")

            echo "[$(date -u +%H:%M:%S)] Stack status: $STACK_STATUS"

            if [[ "$STACK_STATUS" == "STACK_NOT_FOUND" ]]; then
              echo "Stack not found -- exiting."
              exit 0
            fi

            if is_terminal "$STACK_STATUS"; then
              echo "Stack reached terminal state: $STACK_STATUS -- monitor exiting."
              [[ "$CANCEL_ISSUED" == "true" ]] && exit 1
              exit 0
            fi

            # Fetch recent CloudFormation events
            CF_EVENTS=$(aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --max-items 50 \
              --query 'StackEvents[*].{Time:Timestamp,Status:ResourceStatus,Type:ResourceType,Resource:LogicalResourceId,Reason:ResourceStatusReason}' \
              --output json 2>/dev/null || echo "[]")

            # Calculate time since last CF event
            LATEST_EVENT_TS=$(echo "$CF_EVENTS" | jq -r '.[0].Time // empty' 2>/dev/null || echo "")
            MINUTES_SINCE_EVENT=0
            if [[ -n "$LATEST_EVENT_TS" ]]; then
              LATEST_EPOCH=$(date -u -d "$LATEST_EVENT_TS" +%s 2>/dev/null \
                || date -u -j -f "%Y-%m-%dT%H:%M:%S" "${LATEST_EVENT_TS%%.*}" +%s 2>/dev/null \
                || echo "0")
              MINUTES_SINCE_EVENT=$(( ( $(date -u +%s) - LATEST_EPOCH ) / 60 ))
            fi

            # Fetch recent application logs (last 2x poll interval)
            CW_LOGS=""
            if [[ -n "$RESOLVED_LOG_GROUP" ]]; then
              CW_LOGS=$(aws logs filter-log-events \
                --log-group-name "$RESOLVED_LOG_GROUP" \
                --region "$AWS_REGION" \
                --start-time "$(( ($(date -u +%s) - POLL_INTERVAL_SECONDS * 2) * 1000 ))" \
                --query 'events[*].message' \
                --output text 2>/dev/null | tail -50 || echo "")
            fi

            # Fetch recently stopped ECS tasks. Their stopped reasons and exit codes
            # (missing env variable, OOM, failed health check) drive the crash-loop
            # check and explain a CANCEL in the commit comment.
            ECS_STOPPED_TASKS=""
            if [[ -n "$ECS_SERVICE_ARN" && -n "$ECS_CLUSTER" ]]; then
              STOPPED_TASK_ARNS=$(aws ecs list-tasks \
                --cluster "$ECS_CLUSTER" \
                --service-name "$ECS_SERVICE_ARN" \
                --desired-status STOPPED \
                --region "$AWS_REGION" \
                --query 'taskArns[:20]' \
                --output json 2>/dev/null || echo "[]")
              if [[ "$(echo "$STOPPED_TASK_ARNS" | jq 'length')" -gt 0 ]]; then
                ECS_STOPPED_TASKS=$(aws ecs describe-tasks \
                  --cluster "$ECS_CLUSTER" \
                  --tasks $(echo "$STOPPED_TASK_ARNS" | jq -r '.[]') \
                  --region "$AWS_REGION" \
                  --query 'tasks[*].{stoppedAt:stoppedAt,stoppedReason:stoppedReason,containers:containers[*].{name:name,exitCode:exitCode,reason:reason}}' \
                  --output json 2>/dev/null || echo "[]")
              fi
            fi

            # Decide deterministically. GitHub Models, which used to judge this, was
            # retired on 2026-07-30; the rule below encodes what the prompt asked of
            # it. Silence alone is normal while slow resources are in flight (an ECS
            # service waiting for new tasks to pass health checks, a CloudFront
            # distribution propagating, an ACM certificate validating). Silence past
            # the threshold on anything else, or a container that keeps dying, is a
            # hang, and waiting for the six-hour Actions timeout helps nobody.

            # Events belonging to this deploy: everything since the stack's own most
            # recent *_IN_PROGRESS event (the "User Initiated" marker). Falls back to
            # every fetched event when that marker has scrolled out of the window.
            DEPLOY_START_TS=$(echo "$CF_EVENTS" | jq -r --arg s "$STACK_NAME" \
              '[.[] | select(.Resource == $s and (.Status | endswith("IN_PROGRESS")))] | (max_by(.Time) | .Time) // empty')
            DEPLOY_EVENTS=$(echo "$CF_EVENTS" | jq -c --arg t "${DEPLOY_START_TS:-}" \
              '[.[] | select($t == "" or .Time >= $t)]')

            # Resources still in flight: the newest event per logical id, kept when
            # that status is *_IN_PROGRESS. The stack itself is excluded.
            IN_FLIGHT=$(echo "$DEPLOY_EVENTS" | jq -c --arg s "$STACK_NAME" \
              '[group_by(.Resource)[] | max_by(.Time) | select(.Resource != $s and (.Status | endswith("IN_PROGRESS")))]')
            IN_FLIGHT_SUMMARY=$(echo "$IN_FLIGHT" | jq -r '.[] | "\(.Resource) (\(.Type))"' | paste -sd ',' - | sed 's/,/, /g')

            # Every in-flight resource is of a type that legitimately stays silent for
            # a long time: apply the longer grace instead of the hang threshold.
            SLOW_ONLY=$(echo "$IN_FLIGHT" | jq -r --arg slow "$SLOW_RESOURCE_TYPES" \
              'if length == 0 then "false" else (($slow | split(" ") | map(select(. != ""))) as $ok | [.[] | .Type] | all(. as $t | $ok | index($t) != null) | tostring) end')
            EFFECTIVE_THRESHOLD=$HANG_THRESHOLD_MINUTES
            if [[ "$SLOW_ONLY" == "true" && "$SLOW_RESOURCE_GRACE_MINUTES" -gt "$HANG_THRESHOLD_MINUTES" ]]; then
              EFFECTIVE_THRESHOLD=$SLOW_RESOURCE_GRACE_MINUTES
            fi

            # Crash loop: tasks that stopped during this deploy for any reason other
            # than being drained by the deployment itself. Drained tasks report
            # "Scaling activity initiated by (deployment ...)"; everything else
            # (essential container exited, OOM, failed ELB health checks, image pull
            # or init errors) means the new task definition is not becoming healthy.
            FAILED_TASK_COUNT=0
            FAILED_TASK_SUMMARY=""
            if [[ -n "$ECS_STOPPED_TASKS" && "$ECS_STOPPED_TASKS" != "[]" ]]; then
              FAILED_TASKS=$(echo "$ECS_STOPPED_TASKS" | jq -c --arg t "${DEPLOY_START_TS:-}" \
                '[.[] | select($t == "" or ((.stoppedAt // "") >= $t))
                     | select((.stoppedReason // "") | test("Scaling activity initiated|stopped by deployment"; "i") | not)]')
              FAILED_TASK_COUNT=$(echo "$FAILED_TASKS" | jq 'length')
              FAILED_TASK_SUMMARY=$(echo "$FAILED_TASKS" | jq -r \
                '.[] | "- \(.stoppedAt // "?"): \(.stoppedReason // "no reason") [exit codes: \([.containers[]? | (.exitCode // "none") | tostring] | join(","))]"' | head -5)
            fi

            VERDICT="CONTINUE"
            REASON=""
            if [[ "$MAX_FAILED_TASKS" -gt 0 && "$FAILED_TASK_COUNT" -ge "$MAX_FAILED_TASKS" ]]; then
              VERDICT="CANCEL"
              REASON="${FAILED_TASK_COUNT} ECS tasks stopped abnormally since the update started (limit ${MAX_FAILED_TASKS}); the new task definition is not becoming healthy."
            elif [[ "$MINUTES_SINCE_EVENT" -ge "$EFFECTIVE_THRESHOLD" ]]; then
              VERDICT="CANCEL"
              REASON="No CloudFormation event for ${MINUTES_SINCE_EVENT} minutes (threshold ${EFFECTIVE_THRESHOLD})."
              [[ "$SLOW_ONLY" == "true" ]] && REASON+=" The slow-resource grace was already applied."
            fi
            echo "Verdict: ${VERDICT} -- silent ${MINUTES_SINCE_EVENT}m of ${EFFECTIVE_THRESHOLD}m allowed; in flight: ${IN_FLIGHT_SUMMARY:-none reported}; abnormal task stops: ${FAILED_TASK_COUNT}"
            [[ -n "$REASON" ]] && echo "Reason: ${REASON}"

            if [[ "$VERDICT" == "CANCEL" && "$CANCEL_ISSUED" != "true" ]]; then
              CANCEL_ISSUED=true
              COMMENT_BODY="### CDK Deploy Monitor"$'\n\n'
              COMMENT_BODY+="**Stack:** \`$STACK_NAME\` | **Status:** \`$STACK_STATUS\`"$'\n'
              COMMENT_BODY+="**No new CF events for:** ${MINUTES_SINCE_EVENT} minutes (threshold ${EFFECTIVE_THRESHOLD})"$'\n'
              COMMENT_BODY+="**In flight:** ${IN_FLIGHT_SUMMARY:-none reported}"$'\n\n'
              COMMENT_BODY+="**Verdict:** \`CANCEL\`"$'\n\n'"${REASON}"$'\n'
              if [[ -n "$FAILED_TASK_SUMMARY" ]]; then
                COMMENT_BODY+=$'\n'"Abnormally stopped ECS tasks:"$'\n'"${FAILED_TASK_SUMMARY}"$'\n'
              fi
              if [[ -n "$CW_LOGS" ]]; then
                COMMENT_BODY+=$'\n'"<details><summary>Recent application logs</summary>"$'\n\n'"\`\`\`"$'\n'"$(echo "$CW_LOGS" | tail -20 | head -c 3000)"$'\n'"\`\`\`"$'\n'"</details>"$'\n'
              fi
              COMMENT_BODY+=$'\n'"---"$'\n'"*Posted by [reusable-cdk-deploy-monitor](https://github.com/geolonia/.github/blob/main/.github/workflows/reusable-cdk-deploy-monitor.yml)*"

              gh api "repos/$REPO/commits/$SHA/comments" \
                -f body="$COMMENT_BODY" 2>/dev/null || echo "Warning: failed to post commit comment"

              if [[ "$AUTO_CANCEL" != "true" ]]; then
                echo "auto_cancel=false -- advisory comment posted, continuing to monitor."
              elif [[ "$STACK_STATUS" != "UPDATE_IN_PROGRESS" ]]; then
                # cancel-update-stack only applies to an in-progress update. A create
                # or a rollback has to run its course; the comment is the alert.
                echo "Stack is ${STACK_STATUS}, which cannot be cancelled -- advisory comment posted, continuing to monitor."
              else
                echo "Cancelling stack update: $STACK_NAME"
                if aws cloudformation cancel-update-stack \
                  --stack-name "$STACK_NAME" \
                  --region "$AWS_REGION" 2>/tmp/cancel_error; then
                  echo "Stack update cancelled. CloudFormation is rolling back."
                  gh api "repos/$REPO/commits/$SHA/comments" \
                    -f body="### CDK Deploy Monitor -- Update Cancelled"$'\n\n'"Stack \`$STACK_NAME\` update was cancelled (verdict: CANCEL, auto_cancel: true)."$'\n'"CloudFormation is rolling back. The deploy job will fail with a rollback error -- this is expected." \
                    2>/dev/null || true
                else
                  CANCEL_ERR=$(cat /tmp/cancel_error 2>/dev/null || echo "unknown error")
                  echo "cancel-update-stack failed: $CANCEL_ERR"
                  gh api "repos/$REPO/commits/$SHA/comments" \
                    -f body="### CDK Deploy Monitor -- Cancel Attempt Failed"$'\n\n'"Tried to cancel \`$STACK_NAME\` but got: $CANCEL_ERR"$'\n\n'"The stack may have already completed or been cancelled manually." \
                    2>/dev/null || true
                fi
                exit 1
              fi
            fi

            sleep "$POLL_INTERVAL_SECONDS"
          done
