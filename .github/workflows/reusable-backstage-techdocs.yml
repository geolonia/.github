name: "[REUSABLE] Publish TechDocs"

on:
  workflow_call:
    inputs:
      # --- Common fields (all optional) ---
      tag:
        description: "Tag/SHA to build docs from (defaults to current ref). Must be on the publish branch (vars.TECHDOCS_PUBLISH_BRANCH, else the default branch)."
        required: false
        type: string
      environment:
        description: "GitHub environment to deploy to (defaults to 'production')"
        required: false
        type: string

      # --- Runtime/tooling versions ---
      node_version:
        description: "Node.js version"
        required: false
        type: string
      python_version:
        description: "Python version for mkdocs"
        required: false
        type: string
      techdocs_cli_version:
        description: "@techdocs/cli version (npm tag or semver)"
        required: false
        type: string
      mkdocs_core_version:
        description: "mkdocs-techdocs-core version range"
        required: false
        type: string

      # --- AWS / Publishing ---
      aws_region:
        description: "AWS region for publishing"
        required: false
        type: string
      techdocs_bucket:
        description: "S3 bucket for TechDocs"
        required: false
        type: string
      techdocs_entity:
        description: "Backstage entity triplet <namespace>/<kind>/<name>"
        required: false
        type: string
      aws_role_arn:
        description: "Role to assume; if empty, builds ARN from TECHDOCS_AWS_ACCOUNT_ID"
        required: false
        type: string
      build_directory:
        description: "Directory with generated TechDocs site"
        required: false
        type: string

    secrets:
      # An AWS account ID is a non-sensitive identifier. Prefer setting it as
      # an org/repo variable (vars.AWS_ACCOUNT_ID / vars.TECHDOCS_AWS_ACCOUNT_ID),
      # which reusable workflows read automatically — then the caller needs no
      # `secrets:` block at all. These secret inputs remain for back-compat.
      AWS_ACCOUNT_ID:
        description: "Account ID (used to build default role ARN). Prefer vars.AWS_ACCOUNT_ID."
        required: false
      TECHDOCS_AWS_ACCOUNT_ID:
        description: "Org-level fallback Account ID. Prefer the org variable vars.TECHDOCS_AWS_ACCOUNT_ID."
        required: false

env:
  # ---- Cascading defaults: inputs -> vars -> opinionated constant ----
  NODE_VERSION:           ${{ inputs.node_version || vars.TECHDOCS_NODE_VERSION || '24' }}
  PYTHON_VERSION:         ${{ inputs.python_version || vars.TECHDOCS_PYTHON_VERSION || '3.13' }}
  TECHDOCS_CLI_VER:       ${{ inputs.techdocs_cli_version || vars.TECHDOCS_CLI_VERSION || 'latest' }}
  MKDOCS_CORE_VER:        ${{ inputs.mkdocs_core_version || vars.MKDOCS_TECHDOCS_CORE_VERSION || '>=1.6,<2.0' }}

  AWS_REGION:             ${{ inputs.aws_region || vars.AWS_REGION || 'ap-northeast-1' }}
  # secrets first (back-compat), then vars — so callers can supply the account
  # ID via an org/repo variable and omit the `secrets:` block entirely.
  AWS_ACCOUNT_ID:         ${{ secrets.AWS_ACCOUNT_ID || secrets.TECHDOCS_AWS_ACCOUNT_ID || vars.AWS_ACCOUNT_ID || vars.TECHDOCS_AWS_ACCOUNT_ID }}

  TECHDOCS_BUCKET:        ${{ inputs.techdocs_bucket || vars.TECHDOCS_BUCKET || 'geolonia-backstage-techdocs' }}
  TECHDOCS_ENTITY_INPUT:  ${{ inputs.techdocs_entity }}
  TECHDOCS_ENTITY_VAR:    ${{ vars.TECHDOCS_ENTITY }}

  BUILD_DIR:              ${{ inputs.build_directory || vars.TECHDOCS_BUILD_DIR || 'site' }}

jobs:
  publish-techdocs:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || vars.TECHDOCS_ENVIRONMENT || 'production' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validate tool versions and build directory
        # These values come from the caller (inputs) or from variables, and
        # reach `npm i -g`, `pip install`, the setup actions and the publish
        # command. A git or URL spec (`github:owner/repo`, `file:...`,
        # ` @ https://...`) would install code the caller chose, inside the
        # job that holds the publisher's AWS role. Accept only plain version
        # strings and a relative build directory, and fail closed otherwise.
        # Runs first, before the checkout and before any install.
        env:
          # ASCII ranges in the checks below: in some UTF-8 locales [A-Za-z]
          # also matches letters like é.
          LC_ALL: C
        run: |
          set -euo pipefail
          failed=0
          check() {
            # $1 = name shown in the error, $2 = value, $3 = pattern, $4 = hint
            if ! [[ "$2" =~ $3 ]]; then
              echo "::error::$1 is not an accepted value. Allowed: $4."
              failed=1
            fi
          }
          # npm: a semver version or range (1.9.0, ^1.9.0, ~1.9, 1.x) or a
          # dist-tag of @techdocs/cli (latest, next). No ':' or '/', so no
          # git, URL, file or alias specs.
          npm_semver='^[~^]?[0-9]+(\.([0-9]+|x|\*)){0,2}(-[0-9A-Za-z.-]+)?$'
          npm_tag='^[A-Za-z][A-Za-z0-9._-]*$'
          if ! [[ "$TECHDOCS_CLI_VER" =~ $npm_semver || "$TECHDOCS_CLI_VER" =~ $npm_tag ]]; then
            echo "::error::techdocs_cli_version (or vars.TECHDOCS_CLI_VERSION) is not an accepted value. Allowed: a semver version or range like 1.9.0, ^1.9.0, 1.x, or a dist-tag like latest."
            failed=1
          fi
          # pip: one or more comma-separated version specifiers
          # (>=1.6,<2.0, ==1.6.1, ~=1.6). No direct references (' @ URL'),
          # extras or markers.
          pip_clause='(==|!=|<=|>=|<|>|~=) *[0-9]+(\.[0-9]+)*(\.\*)?((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?'
          check "mkdocs_core_version (or vars.MKDOCS_TECHDOCS_CORE_VERSION)" "$MKDOCS_CORE_VER" \
            "^ *${pip_clause}( *, *${pip_clause})* *\$" \
            "pip version specifiers like >=1.6,<2.0 or ==1.6.1"
          check "node_version (or vars.TECHDOCS_NODE_VERSION)" "$NODE_VERSION" \
            '^(lts/([a-z]+|\*)|node|latest|current|[~^]?[0-9]+(\.([0-9]+|x|\*)){0,2}(-[0-9A-Za-z.-]+)?)$' \
            "a Node.js version like 24, 24.1.0, 24.x or lts/*"
          check "python_version (or vars.TECHDOCS_PYTHON_VERSION)" "$PYTHON_VERSION" \
            '^((pypy|graalpy)-?)?[0-9]+(\.([0-9]+|x|\*)){0,2}t?(-[0-9A-Za-z.]+)?$' \
            "a Python version like 3.13, 3.13.1, 3.x or pypy3.10"
          # A relative path inside the checkout: no leading '/', and no
          # segment starting with '.', which also rules out '..'.
          check "build_directory (or vars.TECHDOCS_BUILD_DIR)" "$BUILD_DIR" \
            '^[A-Za-z0-9_][A-Za-z0-9._-]*(/[A-Za-z0-9_][A-Za-z0-9._-]*)*$' \
            "a relative directory like site or build/site (letters, digits, '.', '_', '-', no '..')"
          exit "$failed"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Docs are built from the checkout and published to S3 via OIDC;
          # the checkout git credentials are never reused, so drop them
          # (zizmor artipacked).
          persist-credentials: false

      - name: Refuse a commit that is not on the publish branch
        # The publish below overwrites the live docs, and the publisher role
        # trusts every ref of the org's repositories. A manual run
        # (workflow_dispatch) can start on any branch and `tag` can name any
        # commit, so stop here, before anything from the checkout runs and
        # before any AWS credentials exist, unless the checked-out commit is
        # already on the publish branch (the tip or an ancestor of it).
        # The publish branch is the default branch, unless the repository
        # variable TECHDOCS_PUBLISH_BRANCH names another one (for a repository
        # whose default branch is `develop` but whose docs are published from
        # `main`). It is a variable, not an input: only repository admins can
        # set variables, while anyone who can push a workflow can set inputs.
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_BRANCH_VAR: ${{ vars.TECHDOCS_PUBLISH_BRANCH }}
          # ASCII ranges in the branch check below: in some UTF-8 locales
          # [A-Za-z] also matches letters like é.
          LC_ALL: C
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ -n "${PUBLISH_BRANCH_VAR}" ]; then
            branch="${PUBLISH_BRANCH_VAR}"
            if ! [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
              echo "::error::TECHDOCS_PUBLISH_BRANCH must be a branch name (letters, digits, '.', '_', '/', '-')."
              exit 1
            fi
          else
            branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          fi
          # `heads/` makes the base a branch: a bare name could also match a
          # tag of the same name, which anyone with write access can push.
          if ! status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/heads/${branch}...${sha}?per_page=1" --jq .status)"; then
            echo "::error::Could not compare commit ${sha} with branch ${branch}. Does the branch exist? Check the repository variable TECHDOCS_PUBLISH_BRANCH."
            exit 1
          fi
          case "$status" in
            identical|behind)
              echo "Commit ${sha} is on ${branch}; publishing."
              ;;
            *)
              echo "::error::Commit ${sha} is not on the publish branch ${branch} (compare status: ${status}). TechDocs are published only from merged commits; merge first, then run the workflow on ${branch}. If docs are published from a branch other than the default branch, set the repository variable TECHDOCS_PUBLISH_BRANCH to it."
              exit 1
              ;;
          esac

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install TechDocs CLI
        # Reference the workflow-level env as a shell var (not a ${{ }}
        # expansion) so it never expands into the script (zizmor
        # template-injection).
        run: npm i -g "@techdocs/cli@${TECHDOCS_CLI_VER}"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install MkDocs + TechDocs core
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs-techdocs-core${MKDOCS_CORE_VER}"
          pip install "mkdocs-git-revision-date-localized-plugin>=1,<2"

      - name: Resolve TechDocs entity from catalog-info.yaml (fallback)
        id: techdocs_entity_yaml
        uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 # v4.54.1
        with:
            # result: "namespace/kind/name" (e.g. "geolonia/component/my-service")
            cmd: yq -r 'select(.kind == "Component") | [.metadata.namespace // "default", (.kind // "Component" | downcase), .metadata.name] | join("/")' catalog-info.yaml

      - name: Get final TECHDOCS_ENTITY
        env:
          # Indirect the step output through env so it is not expanded into
          # the script (zizmor template-injection).
          TECHDOCS_ENTITY_YAML: ${{ steps.techdocs_entity_yaml.outputs.result }}
          # ASCII ranges in the entity check below: in some UTF-8 locales
          # [A-Za-z] also matches letters like é.
          LC_ALL: C
        run: |
          # Precedence:
          # 1) workflow input
          # 2) repo/org variable
          # 3) catalog-info.yaml
          ENTITY="${TECHDOCS_ENTITY_INPUT:-${TECHDOCS_ENTITY_VAR:-${TECHDOCS_ENTITY_YAML}}}"

          if [ -z "$ENTITY" ]; then
            echo "ERROR: Could not resolve TECHDOCS_ENTITY (no input, no var, catalog-info.yaml missing metadata.name?)"
            exit 1
          fi

          # Only a single-line Backstage triplet goes into GITHUB_ENV: a line
          # break would add further variables (BASH_ENV, ...) for the later
          # steps, which hold the publisher's AWS role (GHSA-7prm-2m3h-6wr4).
          triplet='^[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*$'
          if ! [[ "$ENTITY" =~ $triplet ]]; then
            echo "::error::TECHDOCS_ENTITY must be one <namespace>/<kind>/<name> triplet (letters, digits, '.', '_', '-' on one line)"
            exit 1
          fi

          echo "Using TECHDOCS_ENTITY=${ENTITY}"
          echo "TECHDOCS_ENTITY=${ENTITY}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws_role_arn != '' && inputs.aws_role_arn || format('arn:aws:iam::{0}:role/GitHubActionsTechDocsPublisher', env.AWS_ACCOUNT_ID) }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Generate TechDocs (no Docker)
        run: techdocs-cli generate --no-docker --verbose

      - name: Publish to S3
        run: |
          techdocs-cli publish \
            --publisher-type awsS3 \
            --storage-name "${TECHDOCS_BUCKET}" \
            --entity "${TECHDOCS_ENTITY}" \
            --directory "./${BUILD_DIR}"
