name: Publish TechDocs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

jobs:
  publish:
    # Publish only from the default branch. `branches:` above does not apply
    # to workflow_dispatch, which can be started on any branch; skip such a
    # run instead of letting it overwrite the live docs with unmerged content.
    # (The reusable workflow also refuses a commit that is not on the default
    # branch; this keeps the run green and skipped.)
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Explicit least-privilege ceiling for the reusable (OIDC publish +
    # checkout); avoids the repo-default token (zizmor excessive-permissions).
    permissions:
      contents: read
      id-token: write
    uses: geolonia/.github/.github/workflows/reusable-backstage-techdocs.yml@810112493789a3255e9ad24a3ba829f05c71918b # v1.43.3
    # Pass only the secrets the reusable declares, not `secrets: inherit`
    # (zizmor secrets-inherit). Both are optional (empty when unset).
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      TECHDOCS_AWS_ACCOUNT_ID: ${{ secrets.TECHDOCS_AWS_ACCOUNT_ID }}
