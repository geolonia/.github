name: Publish TechDocs

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

# Publishing on a docs/** push (above) is the standalone default.
#
# To ALSO publish docs as part of a release (called from publish-release.yml),
# add a workflow_call trigger that declares an explicit secrets contract, and
# have the caller pass the secrets explicitly (do not use `secrets: inherit`):
#
#   on:
#     workflow_call:
#       secrets:
#         AWS_ACCOUNT_ID:
#           required: false
#         TECHDOCS_AWS_ACCOUNT_ID:
#           required: false

jobs:
  publish:
    # Publish only from the publish branch: the repository variable
    # TECHDOCS_PUBLISH_BRANCH if set, else the default branch. `branches:`
    # above does not apply to workflow_dispatch, which can be started on any
    # branch; skip such a run instead of letting it overwrite the live docs
    # with unmerged content. (The reusable workflow also refuses a commit
    # that is not on the publish branch; this keeps the run green and skipped.)
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', vars.TECHDOCS_PUBLISH_BRANCH || github.event.repository.default_branch)
    # Explicit least-privilege ceiling for the reusable (OIDC publish +
    # checkout); avoids the repo-default token (zizmor excessive-permissions).
    permissions:
      contents: read
      id-token: write
    uses: geolonia/.github/.github/workflows/reusable-backstage-techdocs.yml@9dcb56112b5c856c54cbd7713d24e484e616bcc3 # v1.43.4
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      TECHDOCS_AWS_ACCOUNT_ID: ${{ secrets.TECHDOCS_AWS_ACCOUNT_ID }}
    # optional inputs can be specified here to override defaults
    # with:
    #   environment: production
    #   aws_region: ap-northeast-1
    #   techdocs_bucket: ${{ vars.TECHDOCS_BUCKET }}
    #   techdocs_entity: ${{ vars.TECHDOCS_ENTITY }}
