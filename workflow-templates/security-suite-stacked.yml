name: Security Suite (stacked PRs)

# Companion to the org "Security Suite" required workflow. Add this ONLY to a
# repo that is already covered by the org Security Suite ruleset.
#
# Why it exists: the ruleset injects the suite only for pull requests targeting
# the default branch. It cannot simply be widened to every branch, because a
# ruleset rule that covers a branch also gates PUSHES to that branch, and the
# required run cannot exist at push time. Widening it blocks every follow up
# commit on every feature branch with
# "GH013 ... Required workflow 'Security Suite' is not satisfied".
#
# So the ruleset keeps the default branch, and this file covers the rest: a
# pull request stacked on another feature branch gets scanned instead of
# silently skipped. `branches-ignore` makes the two mutually exclusive, so the
# suite never runs twice on one pull request.
#
# Scope, stated plainly: this run is INFORMATIONAL. It is not a required check,
# because making it required means a ruleset rule, which is what gates pushes.
# It turns an invisible gap into a visible red X. Hard enforcement still
# happens at the merge into the default branch, where the ruleset applies.

on:
  pull_request:
    # The template picker replaces $default-branch with the adopting repo's
    # default branch, so this works for repos that do not use `main`.
    branches-ignore: ["$default-branch"]

concurrency:
  group: security-suite-stacked-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    # A called reusable can only downgrade the caller's token, so grant the
    # union the suite's jobs need; the reusable narrows each job to its own
    # minimum.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: geolonia/.github/.github/workflows/reusable-security-suite.yml@v1
