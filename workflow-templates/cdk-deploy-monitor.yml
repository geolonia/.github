# NOTE: This is a partial snippet -- paste the 'monitor' job into your existing deploy workflow file.
# Add this `monitor` job alongside your existing `deploy` job.
# Both jobs run in parallel automatically.
#
# Prerequisites:
#   1. Set CDK_DEPLOY_ROLE_ARN secret in your repo (the same OIDC role used for CDK deploy,
#      with CdkDeployMonitor permissions added -- see docs/workflows.md in geolonia/.github).
#   2. Replace stack_name and aws_region with your values.
#
# The monitor job declares its own permissions below, so it needs nothing from
# your workflow's top-level permissions block. Do not narrow them. Each one
# fails differently, and only the first is loud:
#
#   id-token: write  hard failure. The OIDC role assume errors and the job fails.
#   contents: write  silent. Commit comments are skipped with a warning in the log.
#
# The silent mode is the dangerous one: the job still goes green, so a narrowed
# block looks fine and you quietly lose the alert this workflow exists to post.

jobs:
  # ... your existing deploy job here ...

  monitor:
    # Least privilege for this job alone, matching what the reusable declares.
    permissions:
      id-token: write # OIDC: assume the monitor role (CloudFormation / ECS / logs)
      contents: write # post deploy-status commit comments
    uses: geolonia/.github/.github/workflows/reusable-cdk-deploy-monitor.yml@a7f7ab930920429ec1ea9373ae7325fb769edfcc # v1.37.0
    with:
      stack_name: MyAppStack        # CloudFormation stack name
      aws_region: ap-northeast-1   # AWS region
      # log_group_name: "MyAppStack-MyLogGroup*"  # Optional: CloudWatch log group prefix
      # hang_threshold_minutes: 10                # Optional: default 10, silence before CANCEL
      # slow_resource_grace_minutes: 20           # Optional: default 20, while only ECS/CloudFront/ACM/RDS are in flight
      # max_failed_tasks: 3                       # Optional: default 3, abnormal ECS task stops before CANCEL
      # auto_cancel: false                        # Optional: set true to enable auto-cancel
    secrets:
      aws_role_arn: ${{ secrets.CDK_DEPLOY_ROLE_ARN }}
