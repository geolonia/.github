name: Sync Team Access

# Nudges the central team-access sync in geolonia-operations after
# catalog-info.yaml changes on the default branch, so the declared owner and
# accessGrants are applied within minutes instead of at the nightly run.
# The central sync reads catalog-info.yaml from this repository's default
# branch itself; nothing sent from here can grant access.

on:
  push:
    # No branch filter: the default branch is not always `main`, and the
    # reusable skips every run that is not on the repository's default
    # branch, so pushes to other branches end as a skipped job.
    paths: ['catalog-info.yaml']
  # Re-run the sync by hand (Actions -> Sync Team Access -> Run workflow).
  # Runs from any branch other than the default branch are skipped.
  workflow_dispatch:

# Explicit least-privilege ceiling: the reusable only sends a dispatch via an
# App token, so the caller token needs nothing (avoids the repo-default token,
# which zizmor flags as excessive-permissions).
permissions: {}

jobs:
  sync:
    uses: geolonia/.github/.github/workflows/reusable-sync-team-access.yml@1840b3e7f0fc1c37e391295ccf7067567bbb676d # v1.40.0
    # Pass only the dispatch secrets the reusable declares, not
    # `secrets: inherit` (zizmor secrets-inherit).
    secrets:
      OPS_DISPATCH_CLIENT_ID: ${{ secrets.OPS_DISPATCH_CLIENT_ID }}
      OPS_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.OPS_DISPATCH_APP_PRIVATE_KEY }}
    # Optional settings (uncomment to override defaults):
    # with:
    #   dispatch_repo: geolonia/geolonia-operations
